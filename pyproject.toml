[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kelimeavi"
version = "1.0.0"
description = "Turkish word game: scrambled letters, Wordle-style grading, Turkish-aware normalization. Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["oyun", "kelime", "türkçe", "wordle", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Natural Language :: Turkish",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Puzzle Games",
]

[project.scripts]
kelimeavı = "kelimeavi.cli:main"

[tool.setuptools.packages.find]
include = ["kelimeavi*"]
